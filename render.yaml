# Render Blueprint - deploys the backend as a Node web service.
# Secrets (MONGO_URI, JWT_SECRET) are entered in the Render dashboard, not here.
services:
  - type: web
    name: quickbite-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
